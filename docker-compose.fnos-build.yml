services:
  visual-prompt-library:
    build: .
    image: visual-prompt-library:local
    container_name: visual-prompt-library
    ports:
      - "8765:8765"
    volumes:
      - /vol1/1000/visual-prompt-library/data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
